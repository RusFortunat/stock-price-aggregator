name: Stock Price Aggregator Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  STACK_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Lambda
        working-directory: ingestion-lambda
        run: |
          npm ci
          npm run build
          cd dist && zip -r lambda.zip .

      - name: Build FastAPI image
        working-directory: api
        run: docker build -t fastapi-stock-price .

      - name: Build dbt image
        working-directory: dbt-project
        run: docker build -t dbt-stock-price .

  deploy:
    name: Terraform Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Debug vars
        run: |
          echo "Account: ${{ env.AWS_ACCOUNT_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Role ARN: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy"

      - name: Debug OIDC token claims
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - working-directory: terraform
        run: terraform init

      - working-directory: terraform
        run: terraform apply -auto-approve

  push:
    name: Push Images & Upload DAGs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build & push dbt image
        working-directory: dbt
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}-dbt:${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}-dbt:${{ github.sha }}

      - name: Build & push API image
        working-directory: api
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}-api:${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}-api:${{ github.sha }}

      - name: Force new API deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.STACK_NAME }}-cluster \
            --service ${{ env.STACK_NAME }}-api \
            --force-new-deployment

      - name: Upload ingestion Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.STACK_NAME }}-ingestion \
            --zip-file fileb://ingestion-lambda/dist/lambda.zip

      - name: Upload DAGs to MWAA bucket
        run: |
          aws s3 cp airflow/dags/stock_price_pipeline.py \
            s3://${{ env.STACK_NAME }}-mwaa-${{ env.AWS_ACCOUNT_ID }}/dags/